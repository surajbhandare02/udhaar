<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0f172a"/>
<title>Ledger — Udhaar & Expense</title>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="icon" type="image/svg+xml" href="/icon.svg"/>
<style>
:root { --bg:#f8fafc; --card:#fff; --border:#e2e8f0; --text:#0f172a; --muted:#64748b; --navy:#0f172a; --green:#15803d; --red:#b91c1c; --font:-apple-system, BlinkMacSystemFont, "Inter", sans-serif; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }
body { background: var(--bg); color: var(--text); font-size: 14px; }
.app { max-width: 500px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom)); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.btn { padding: 7px 12px; border-radius: 6px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 13px; font-weight: 500; }
.btn-primary { background: var(--navy); color: #fff; border-color: var(--navy); }
.grid-2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.tile { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 10px; cursor: pointer; }
.tile-label { font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.tile-val { font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.tabs { display: flex; background: #f1f5f9; padding: 2px; border-radius: 6px; gap: 2px; margin-bottom: 10px; }
.tab { flex: 1; padding: 6px; font-size: 12px; border-radius: 4px; border: none; background: transparent; cursor: pointer; font-weight: 500; }
.tab.active { background: #fff; color: var(--text); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
.field { margin-bottom: 8px; }
.field label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 3px; }
input, select { width: 100%; height: 38px; border: 1px solid var(--border); border-radius: 6px; padding: 0 10px; font-size: 16px !important; outline: none; background: #fff; }
.row-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
.row-item:last-child { border-bottom: none; }
.badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.badge-green { background: #f0fdf4; color: var(--green); } .badge-red { background: #fef2f2; color: var(--red); }
.tx-amt { font-weight: 700; font-variant-numeric: tabular-nums; }
.tx-amt.debit { color: var(--red); } .tx-amt.credit { color: var(--green); }
.del-btn { border: none; background: transparent; color: var(--muted); cursor: pointer; padding: 4px; font-size: 12px; }
.pin-gate { position: fixed; inset: 0; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
</style>
</head>
<body>
<div id="pin-screen" class="pin-gate" style="display:none">
  <div style="font-size:26px;font-weight:800;margin-bottom:8px">₹ Ledger</div>
  <p style="color:var(--muted);margin-bottom:14px;font-size:13px">Enter 4-digit PIN</p>
  <input type="password" id="pin-input" inputmode="numeric" maxlength="6" style="width:170px;text-align:center;font-size:22px!important;letter-spacing:6px;margin-bottom:12px" autofocus/>
  <button class="btn btn-primary" onclick="submitPin()" style="width:170px">Unlock</button>
</div>

<div class="app">
  <div class="header">
    <div>
      <div style="font-size:1.05rem;font-weight:700">Udhaar Ledger</div>
      <div style="font-size:11px;color:var(--muted)" id="header-date">Today</div>
    </div>
    <div style="display:flex;gap:6px">
      <button class="btn" onclick="refresh()" title="Refresh">🔄</button>
      <button class="btn" onclick="syncNotesPrompt()" title="Import SMS/Notes">📋</button>
    </div>
  </div>

  <div class="grid-2x2">
    <div class="tile" onclick="editAccount(1)"><div class="tile-label">UPI / Bank</div><div class="tile-val" id="val-bank">₹0</div></div>
    <div class="tile" onclick="editAccount(2)"><div class="tile-label">Cash</div><div class="tile-val" id="val-cash">₹0</div></div>
    <div class="tile"><div class="tile-label">Month Spent</div><div class="tile-val" style="color:var(--red)" id="val-spent">₹0</div></div>
    <div class="tile"><div class="tile-label">Udhaar Net</div><div class="tile-val" id="val-udhaar">₹0</div></div>
  </div>

  <div class="card">
    <div class="tabs" id="type-tabs">
      <button type="button" class="tab active" onclick="setType('expense')">Expense</button>
      <button type="button" class="tab" onclick="setType('income')">Income</button>
      <button type="button" class="tab" onclick="setType('gaveTook')">Gave/Took</button>
      <button type="button" class="tab" onclick="setType('transfer')">Transfer</button>
    </div>

    <form onsubmit="submitTx(event)">
      <div class="field"><label>Amount (₹) *</label><input type="number" id="f-amount" step="0.01" inputmode="decimal" placeholder="0.00" required/></div>
      <div id="dir-field" class="field" style="display:none"><label>Direction</label><select id="f-dir"><option value="lent">I Lent (They Owe Me)</option><option value="borrowed">I Borrowed (I Owe Them)</option></select></div>
      <div id="person-field" class="field" style="display:none"><label>Person Name *</label><input type="text" id="f-person" list="people-datalist" placeholder="e.g. Rahul"/><datalist id="people-datalist"></datalist></div>
      <div style="display:flex;gap:8px">
        <div class="field" style="flex:1"><label>Account</label><select id="f-acc"></select></div>
        <div class="field" id="to-acc-field" style="flex:1;display:none"><label>To Account</label><select id="f-to-acc"></select></div>
      </div>
      <div class="field" id="note-field"><label>Merchant / Note</label><input type="text" id="f-note" placeholder="Optional remark..."/></div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:4px">Save Entry</button>
    </form>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="font-weight:700">Pending Udhaar</span><span style="font-size:12px;color:var(--muted)" id="people-count">0 pending</span></div>
    <div id="people-list"></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="font-weight:700">Recent Transactions</span></div>
    <input type="text" id="tx-search" placeholder="🔍 Search entries..." oninput="renderTx()" style="height:34px;margin-bottom:8px"/>
    <div id="tx-list"></div>
  </div>
</div>

<script>
let state = { accounts: [], people: [], monthlyExpense: 0, transactions: [] };
let activeType = 'expense';
const fmt = n => '₹' + Number(n||0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
document.getElementById('header-date').textContent = new Date().toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });

function setType(t) {
  activeType = t;
  document.querySelectorAll('#type-tabs .tab').forEach((b, i) => b.classList.toggle('active', ['expense','income','gaveTook','transfer'][i] === t));
  document.getElementById('dir-field').style.display = t === 'gaveTook' ? 'block' : 'none';
  document.getElementById('person-field').style.display = t === 'gaveTook' ? 'block' : 'none';
  document.getElementById('to-acc-field').style.display = t === 'transfer' ? 'block' : 'none';
  document.getElementById('note-field').style.display = t === 'transfer' ? 'none' : 'block';
}

async function refresh() {
  try {
    const res = await fetch('/api/state').then(r => r.json());
    if (res.requiresPin) { document.getElementById('pin-screen').style.display = 'flex'; return; }
    document.getElementById('pin-screen').style.display = 'none';
    state = res;

    const bank = state.accounts.find(a => /upi|bank/i.test(a.name)) || state.accounts[0] || { balance: 0 };
    const cash = state.accounts.find(a => /cash/i.test(a.name)) || state.accounts[1] || { balance: 0 };
    document.getElementById('val-bank').textContent = fmt(bank.balance);
    document.getElementById('val-cash').textContent = fmt(cash.balance);
    document.getElementById('val-spent').textContent = fmt(state.monthlyExpense);

    const udhaarNet = state.people.reduce((s, p) => s + (p.net_balance || 0), 0);
    const uEl = document.getElementById('val-udhaar');
    uEl.textContent = (udhaarNet >= 0 ? '+ ' : '') + fmt(udhaarNet);
    uEl.style.color = udhaarNet >= 0 ? 'var(--green)' : 'var(--red)';

    const optHtml = state.accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
    document.getElementById('f-acc').innerHTML = optHtml;
    document.getElementById('f-to-acc').innerHTML = optHtml;
    if (state.accounts[1]) document.getElementById('f-to-acc').value = state.accounts[1].id;
    document.getElementById('people-datalist').innerHTML = state.people.map(p => `<option value="${p.name}"/>`).join('');

    document.getElementById('people-count').textContent = `${state.people.length} pending`;
    document.getElementById('people-list').innerHTML = state.people.length ? state.people.map(p => {
      const owes = p.net_balance > 0;
      return `<div class="row-item">
        <div><div style="font-weight:600">${p.name}</div><div style="font-size:11px;color:var(--muted)">${p.phone || 'Contact'}</div></div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="badge ${owes ? 'badge-green' : 'badge-red'}">${owes ? 'Owes you ' : 'You owe '}${fmt(Math.abs(p.net_balance))}</span>
          <button class="btn" style="padding:3px 8px;font-size:11px" onclick="settlePrompt(${p.id}, '${p.name}', ${p.net_balance})">Settle</button>
        </div>
      </div>`;
    }).join('') : '<div style="color:var(--muted);font-size:12px;padding:8px 0">No outstanding customer balances 🎉</div>';

    renderTx();
  } catch(e) { console.error(e); }
}

function renderTx() {
  const q = (document.getElementById('tx-search').value || '').toLowerCase().trim();
  const txs = (state.transactions || []).filter(t => !q || (t.merchant||'').toLowerCase().includes(q) || (t.note||'').toLowerCase().includes(q) || (t.person_name||'').toLowerCase().includes(q));
  document.getElementById('tx-list').innerHTML = txs.length ? txs.map(t => {
    const isDebit = ['expense','lent','settle_out','transfer'].includes(t.type);
    return `<div class="row-item">
      <div><div style="font-weight:600">${t.person_name || t.merchant || t.category || t.type}</div><div style="font-size:11px;color:var(--muted)">${t.type} · ${t.account_name || 'Account'}</div></div>
      <div style="display:flex;align-items:center;gap:6px">
        <span class="tx-amt ${isDebit ? 'debit' : 'credit'}">${isDebit ? '-' : '+'}${fmt(t.amount)}</span>
        <button class="del-btn" onclick="delTx(${t.id})">✕</button>
      </div>
    </div>`;
  }).join('') : '<div style="color:var(--muted);font-size:12px;padding:8px 0">No transactions recorded.</div>';
}

async function submitTx(e) {
  e.preventDefault();
  const amount = parseFloat(document.getElementById('f-amount').value);
  if (!amount || amount <= 0) return alert('Enter valid amount');
  let type = activeType;
  if (type === 'gaveTook') type = document.getElementById('f-dir').value;

  const res = await fetch('/api/transactions', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      type, amount,
      account_id: parseInt(document.getElementById('f-acc').value),
      to_account_id: parseInt(document.getElementById('f-to-acc').value),
      person_name: document.getElementById('f-person').value.trim(),
      note: document.getElementById('f-note').value.trim()
    })
  });
  if (res.ok) { document.getElementById('f-amount').value = ''; document.getElementById('f-note').value = ''; refresh(); }
  else { const err = await res.json(); alert(err.error || 'Failed to save'); }
}

async function settlePrompt(id, name, bal) {
  const isReceive = bal > 0;
  const amt = prompt(`Settle ${isReceive ? 'from' : 'to'} ${name} (Max: ₹${Math.abs(bal)}):`, Math.abs(bal));
  if (!amt || isNaN(amt) || parseFloat(amt) <= 0) return;
  const defAcc = (state.accounts[0] || {}).id || 1;
  await fetch('/api/transactions', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ type: isReceive ? 'settle_in' : 'settle_out', amount: parseFloat(amt), person_id: id, account_id: defAcc, note: 'Settled' })
  });
  refresh();
}

async function delTx(id) {
  if (!confirm(`Delete transaction and reverse balance?`)) return;
  await fetch(`/api/transactions/${id}`, { method: 'DELETE' });
  refresh();
}

async function editAccount(id) {
  const acc = state.accounts.find(a => a.id === id) || state.accounts[id - 1];
  if (!acc) return;
  const val = prompt(`Update balance for ${acc.name}:`, acc.balance);
  if (val === null || isNaN(val)) return;
  await fetch(`/api/accounts/${acc.id}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ balance: parseFloat(val) }) });
  refresh();
}

async function syncNotesPrompt() {
  const raw = prompt('Paste bank SMS or Notes:');
  if (!raw) return;
  const res = await fetch('/api/webhook/sms', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ raw_text: raw }) }).then(r=>r.json());
  alert(`Imported: ${res.imported || 0}, Duplicates: ${res.duplicates || 0}, Ignored: ${res.ignored || 0}`);
  refresh();
}

async function submitPin() {
  const pin = document.getElementById('pin-input').value;
  const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ pin }) });
  if (res.ok) refresh(); else alert('Incorrect PIN');
}

refresh();
</script>
</body>
</html>
